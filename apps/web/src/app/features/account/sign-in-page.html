<main
  data-testid="account-sign-in"
  class="flex justify-center bg-surface-container-low px-margin-mobile py-space-xl md:px-margin-tablet"
>
  <div class="flex w-full max-w-md flex-col gap-space-lg">
    <app-account-card
      heading="Sign in to rate hotels"
      intro="Use your account to rate the hotels of the collection."
      [error]="errorMessage()"
    >
      <form [formGroup]="form" novalidate class="flex flex-col gap-gutter" (ngSubmit)="submit()">
        <div class="flex flex-col gap-space-xs">
          <label for="sign-in-email" class="text-label-lg uppercase text-on-surface-variant">Email</label>
          <input
            id="sign-in-email"
            type="email"
            formControlName="email"
            autocomplete="username"
            inputmode="email"
            spellcheck="false"
            [attr.aria-invalid]="emailError() !== null"
            [attr.aria-describedby]="emailError() !== null ? 'sign-in-email-error' : null"
            [class]="fieldClasses"
            [class.border-error]="emailError() !== null"
            [class.border-outline-variant]="emailError() === null"
          />
          @if (emailError(); as message) {
            <p id="sign-in-email-error" data-testid="sign-in-email-error" class="text-body-sm text-error">{{ message }}</p>
          }
        </div>

        <app-password-field
          fieldId="sign-in-password"
          label="Password"
          autocomplete="current-password"
          [control]="form.controls.password"
          [error]="passwordError()"
        />

        <button
          type="submit"
          data-testid="sign-in-submit"
          [disabled]="submitting()"
          [attr.aria-busy]="submitting()"
          class="mt-space-sm inline-flex min-h-11 w-full items-center justify-center gap-space-sm rounded-lg bg-primary-container px-space-md py-space-sm text-label-lg uppercase text-on-primary shadow-md transition-colors hover:bg-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-wait disabled:opacity-70"
        >
          @if (submitting()) {
            <span
              class="h-4 w-4 rounded-full border-2 border-on-primary/40 border-t-on-primary motion-safe:animate-spin"
              aria-hidden="true"
            ></span>
            Signing in…
          } @else {
            Sign in
          }
        </button>
      </form>

      <p class="flex flex-wrap items-center gap-x-space-sm text-body-sm text-on-surface-variant">
        New here?
        <a
          data-testid="sign-in-register-link"
          routerLink="/account/register"
          [queryParams]="returnQuery"
          class="inline-flex min-h-11 items-center text-label-lg uppercase text-primary underline-offset-4 transition-colors hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        >Create an account</a>
      </p>
    </app-account-card>

    <a
      routerLink="/"
      class="inline-flex min-h-11 items-center justify-center self-center text-label-lg uppercase text-on-surface-variant transition-colors hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
    >
      Back to the collection
    </a>
  </div>
</main>
